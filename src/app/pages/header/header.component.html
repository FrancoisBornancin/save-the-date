<div [style]="globalHeaderStyle()">
    <div [style]="textStyle()">
        <!-- <p>Bienvenu</p> -->
        <p>Alexandra et François</p>
    </div>

    <ng-container *ngFor="let headerTitle of getTitles()">
        <p-button (click)="returnPage(headerTitle)" [style]="buttonsClass()">
            <i [ngClass]="getButtonClass(headerTitle)" [style]="getButtonStyle()">
                {{ headerTitle }}
            </i>
        </p-button>
    </ng-container>
</div>
